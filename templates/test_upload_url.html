<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Teste Scraping NFC-e</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .container {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            white-space: pre-wrap;
            word-break: break-word;
        }

    </style>

</head>


<body>

    <h1>Teste Scraping NFC-e</h1>


    <div class="container">

        <p>
            Informe a URL da NFC-e da SEFAZ:
        </p>


        <input
            type="url"
            id="url"
            placeholder="http://nfce.sefaz.ce.gov.br/..."
        >


        <button onclick="consultarNfce()">
            Consultar
        </button>


        <div id="resultado">
            Resultado aparecerá aqui.
        </div>

    </div>


    <script>

        async function consultarNfce() {

            const url =
                document.getElementById("url").value;

            const resultado =
                document.getElementById("resultado");


            if (!url) {

                resultado.textContent =
                    "Informe uma URL.";

                return;
            }


            resultado.textContent =
                "Consultando SEFAZ...";


            try {

                const response =
                    await fetch(
                        "/test-url/qr-code/",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                url: url
                            })
                        }
                    );


                const data =
                    await response.json();


                console.log(
                    "Resposta do backend:",
                    data
                );


                if (!response.ok) {

                    resultado.textContent =
                        data.detail ||
                        "Erro ao consultar a SEFAZ.";

                    return;
                }


                resultado.textContent =
                    JSON.stringify(
                        data,
                        null,
                        4
                    );


            } catch (error) {

                console.error(error);

                resultado.textContent =
                    "Erro ao conectar com o backend.";
            }

        }

    </script>

</body>

</html>
