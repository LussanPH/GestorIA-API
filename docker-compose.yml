services:
  geladeira_virtual:
    image: postgres:16
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  gerador_de_compras:
    image: proguimador/fake-nfce-generator:1.0.0
    ports:
      - "127.0.0.1:8001:8080"
    restart: unless-stopped
volumes:
  postgres_data:
